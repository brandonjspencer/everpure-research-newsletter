name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write lets a live build commit the refreshed data/Everpure.html
    # snapshot back to main (see "Refresh committed Notion snapshot" below).
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      SOURCE_URL: ${{ secrets.SOURCE_URL }}
      NOTION_FETCH_METHOD: auto
      NOTION_FETCH_TIMEOUT: "180"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_FETCH_LIMIT: ${{ vars.GOOGLE_FETCH_LIMIT || '17' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: bash netlify/build.sh

      - name: Report source freshness
        run: |
          MANIFEST=publish/data/refresh_manifest.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::No refresh_manifest.json produced; could not determine source freshness."
            exit 0
          fi
          METHOD=$(python3 -c "import json;print((json.load(open('$MANIFEST')).get('source') or {}).get('fetch_method') or '')")
          FALLBACK=$(python3 -c "import json;print((json.load(open('$MANIFEST')).get('source') or {}).get('source_fallback') or '')")
          {
            echo "### Source freshness"
            echo "- fetch_method: \`${METHOD:-unknown}\`"
            [ -n "$FALLBACK" ] && echo "- source_fallback: \`$FALLBACK\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$METHOD" in
            notion_api|playwright|requests)
              echo "- live Notion fetch" >> "$GITHUB_STEP_SUMMARY" ;;
            local_html_fallback)
              echo "- used committed data/Everpure.html snapshot (may lag Notion)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Source freshness: used the committed snapshot fallback (local_html_fallback), not a live fetch." ;;
            *)
              echo "- non-live source tier" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Source freshness: not a live fetch (fetch_method='${METHOD:-unknown}', fallback='${FALLBACK:-}'). Verify before treating the issue as current." ;;
          esac

      - name: Refresh committed Notion snapshot
        run: |
          # Keep data/Everpure.html (the fallback the build parses when a live
          # fetch fails) current: on a live build, overwrite it with the freshly
          # fetched HTML and commit only if it changed. [skip ci] stops the
          # commit from re-triggering this workflow (and ci.yml).
          python3 scripts/refresh_committed_snapshot.py \
            --manifest publish/data/refresh_manifest.json \
            --dest data/Everpure.html \
            --raw-dir raw
          if git diff --quiet -- data/Everpure.html; then
            echo "Snapshot unchanged; nothing to commit."
            echo "- committed snapshot: unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/Everpure.html
            git commit -m "chore: refresh committed Notion snapshot [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "Push rejected (attempt $attempt); rebasing on origin/main."
              git fetch origin main
              git rebase origin/main || git rebase --abort
            done
            if [ "$pushed" = 1 ]; then
              echo "Pushed refreshed snapshot to main."
              echo "- committed snapshot: refreshed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not push refreshed snapshot after 3 attempts."
              echo "- committed snapshot: refresh push failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
